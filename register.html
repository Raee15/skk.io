<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Portal - Create an Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/register.css" />
</head>
<body>

  <div class="page">

    <section class="hero">
      <div class="hero__shape hero__shape--one"></div>
      <div class="hero__shape hero__shape--two"></div>

      <div class="hero__brand">
        <div class="hero__logo-circle">
          
          <img src="navbar.png" alt="SK Logo" class="hero__logo-img" />
        </div>
        <h1 class="hero__brand-title">SK Connect</h1>
        <p class="hero__brand-tagline"></p>
      </div>
    </section>

    <!-- right side, registration form -->
    <main class="register-panel">
      <div class="register-card">

        <div class="register-card__header">
          <h2 class="register-card__title">Create an Account</h2>
          <p class="register-card__subtitle">
            Fill out the form below to register for the SK Portal.
            Fields marked with <span class="req">*</span> are required.
          </p>
        </div>

       
        <form id="registerForm" class="register-form" action="#" method="post" novalidate>

          <div id="form-message" class="form-message" hidden>
            Please complete all required fields.
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="fullName">Full Name <span class="req">*</span></label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Juan Dela Cruz"
                autocomplete="name"
                required
              />
              <span class="field-error" id="fullName-error"></span>
            </div>

            <div class="form-group">
              <label for="username">Username <span class="req">*</span></label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="juandelacruz"
                autocomplete="username"
                required
              />
              <span class="field-error" id="username-error"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Email Address <span class="req">*</span></label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="juan@barangay.gov.ph"
                autocomplete="email"
                required
              />
              <span class="field-error" id="email-error"></span>
            </div>

            <div class="form-group">
              <label for="dob">Date of Birth <span class="req">*</span></label>
              <input
                type="date"
                id="dob"
                name="dob"
                autocomplete="bday"
                required
              />
              <span class="field-error" id="dob-error"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="address">Address <span class="req">*</span></label>
            <input
              type="text"
              id="address"
              name="address"
              placeholder="House No., Street, Barangay, City/Municipality"
              autocomplete="street-address"
              required
            />
            <span class="field-error" id="address-error"></span>
          </div>

          <div class="form-group">
            <label for="contactNumber">Contact Number <span class="req">*</span></label>
            <input
              type="tel"
              id="contactNumber"
              name="contactNumber"
              placeholder="09XX XXX XXXX"
              autocomplete="tel"
              inputmode="tel"
              required
            />
            <span class="field-error" id="contactNumber-error"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password <span class="req">*</span></label>
              <div class="input-wrap">
                <!--
                  same pure-css show/hide trick as login page,
                  walang JS na kailangan
                -->
                <input
                  type="text"
                  id="password"
                  name="password"
                  class="password-field"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  required
                />
                <input type="checkbox" id="togglePassword" class="toggle-password-checkbox" />
                <label for="togglePassword" class="toggle-password">
                  <svg class="icon-eye" viewBox="0 0 24 24">
                    <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24">
                    <path d="M3 3l18 18" />
                    <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.5 13.5 0 0 1-3.1 3.9M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7a10.6 10.6 0 0 0 4.2-.85" />
                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  </svg>
                </label>
              </div>
              <span class="field-error" id="password-error"></span>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
              <div class="input-wrap">
                <input
                  type="text"
                  id="confirmPassword"
                  name="confirmPassword"
                  class="password-field"
                  placeholder="Re-enter your password"
                  autocomplete="new-password"
                  required
                />
                <input type="checkbox" id="toggleConfirmPassword" class="toggle-password-checkbox" />
                <label for="toggleConfirmPassword" class="toggle-password">
                  <svg class="icon-eye" viewBox="0 0 24 24">
                    <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24">
                    <path d="M3 3l18 18" />
                    <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.5 13.5 0 0 1-3.1 3.9M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7a10.6 10.6 0 0 0 4.2-.85" />
                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  </svg>
                </label>
              </div>
              <span class="field-error" id="confirmPassword-error"></span>
            </div>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" id="terms" name="terms" required />
            <span>
              I agree to the
              <a href="terms.html" class="link-inline">Terms and Conditions</a>
              and <a href="privacy.html" class="link-inline">Privacy Policy</a>
              <span class="req">*</span>
            </span>
          </label>

          <button type="submit" class="btn-register" id="registerButton">
            Register
          </button>

          <p class="login-line">
            Already have an account?
            <a href="login.html" class="link-inline link-inline--strong">Log In</a>
          </p>
        </form>

      </div>

      <p class="footnote">
        &copy; 2026 Sangguniang Kabataan Portal - for barangay youth &amp; council use
      </p>
    </main>

  </div>

</body>
</html>
